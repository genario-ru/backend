name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE: ${{ github.sha }}
  GLITCHTIP_DIST_DIR: .tmp/glitchtip-dist

jobs:
  build-and-push:
    name: Build, upload sourcemaps & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SENTRY_URL: ${{ secrets.GLITCHTIP_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.GLITCHTIP_ORG }}
      SENTRY_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Validate GlitchTip configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${SENTRY_URL:?Missing GLITCHTIP_URL secret}"
          : "${SENTRY_AUTH_TOKEN:?Missing GLITCHTIP_AUTH_TOKEN secret}"
          : "${SENTRY_ORG:?Missing GLITCHTIP_ORG secret}"
          : "${SENTRY_PROJECT:?Missing GLITCHTIP_PROJECT secret}"
          : "${RELEASE:?Missing release value}"

      - name: Export production dist for GlitchTip sourcemaps
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dist-assets
          outputs: type=local,dest=${{ env.GLITCHTIP_DIST_DIR }}
          build-args: |
            GLITCHTIP_RELEASE=${{ env.RELEASE }}

      - name: Install Sentry CLI
        shell: bash
        run: npm install --global @sentry/cli

      - name: Upload GlitchTip sourcemaps
        shell: bash
        run: |
          set -euo pipefail

          dist_dir="${GLITCHTIP_DIST_DIR}/app"

          echo "Found $(find "$dist_dir" -type f -name '*.map' | wc -l) sourcemap files before upload"
          sentry-cli releases new "$RELEASE" || sentry-cli releases info "$RELEASE" > /dev/null
          sentry-cli sourcemaps inject "$dist_dir"
          echo "Injected debug IDs into $(grep -R --include='*.js' -l 'debugId' "$dist_dir" | wc -l) JavaScript files"
          sentry-cli sourcemaps upload "$dist_dir" --release "$RELEASE"
          find "$dist_dir" -type f -name '*.map' -delete
          sentry-cli releases finalize "$RELEASE"

      - name: Build and push injected GlitchTip dist
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prebuilt-dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PREBUILT_DIST_DIR=${{ env.GLITCHTIP_DIST_DIR }}/app
            GLITCHTIP_RELEASE=${{ env.RELEASE }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Record GlitchTip deploy
        run: sentry-cli releases deploys "$RELEASE" new --env production --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  deploy:
    name: Deploy via Dokploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Dokploy deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_API_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: compose

services:
  server:
    image: ghcr.io/genario-ru/backend:latest
    pull_policy: always
    command: pnpm run start
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - FIXED_SIGN_IN_OTPS=${FIXED_SIGN_IN_OTPS}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - ROUTER_AI_BASE_URL=${ROUTER_AI_BASE_URL}
      - ROUTER_AI_API_KEY=${ROUTER_AI_API_KEY}
      - ROUTER_AI_STRUCTURED_OUTPUT_MODEL=${ROUTER_AI_STRUCTURED_OUTPUT_MODEL}
      - ROUTER_AI_IMAGE_MODEL=${ROUTER_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - TOCHKA_OPENAPI_URL=${TOCHKA_OPENAPI_URL}
      - TOCHKA_BASE_API_URL=${TOCHKA_BASE_API_URL}
      - TOCHKA_JWT_TOKEN=${TOCHKA_JWT_TOKEN}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - RUTUBE_BASE_API_URL=${RUTUBE_BASE_API_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}

  workers:
    image: ghcr.io/genario-ru/backend:latest
    pull_policy: always
    command: pnpm run start:workers
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - ROUTER_AI_BASE_URL=${ROUTER_AI_BASE_URL}
      - ROUTER_AI_API_KEY=${ROUTER_AI_API_KEY}
      - ROUTER_AI_STRUCTURED_OUTPUT_MODEL=${ROUTER_AI_STRUCTURED_OUTPUT_MODEL}
      - ROUTER_AI_IMAGE_MODEL=${ROUTER_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - TOCHKA_OPENAPI_URL=${TOCHKA_OPENAPI_URL}
      - TOCHKA_BASE_API_URL=${TOCHKA_BASE_API_URL}
      - TOCHKA_JWT_TOKEN=${TOCHKA_JWT_TOKEN}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - RUTUBE_BASE_API_URL=${RUTUBE_BASE_API_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}

# Переменные ${DEPLOY_ENVIRONMENT}, ${IMAGE_TAG} и все секреты ниже
# подставляются Dokploy из настроек Environment приложения в момент
# `docker compose up` (это НЕ переменные сборки и НЕ значения из GitHub Actions).
# Каждое окружение (stage / production) задает свой набор в своем приложении Dokploy.
# DEPLOY_ENVIRONMENT и IMAGE_TAG указаны через ${VAR:?...}, поэтому при их
# отсутствии compose упадет с явной ошибкой, а не подтянет чужой образ по дефолту.
services:
  # One-shot сервис: один раз применяет миграции и завершается.
  # server и workers ждут его успешного завершения через depends_on, поэтому
  # схема БД всегда приведена в актуальное состояние до старта приложения.
  migrate:
    image: ghcr.io/genario-ru/backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run db:migrate
    restart: "no"
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}

  server:
    image: ghcr.io/genario-ru/backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run start
    ports:
      - "${HTTP_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_FIXED_SIGN_IN_OTPS=${BETTER_AUTH_FIXED_SIGN_IN_OTPS}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - SOCIALKIT_OPENAPI_URL=${SOCIALKIT_OPENAPI_URL}
      - SOCIALKIT_BASE_API_URL=${SOCIALKIT_BASE_API_URL}
      - SOCIALKIT_API_KEY=${SOCIALKIT_API_KEY}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_IPS=${YOOKASSA_IPS}
      - DISABLE_PAYMENTS=${DISABLE_PAYMENTS}
      - SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED=${SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED}
      - UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED=${UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED}
      - TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED=${TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - METRICS_ALLOWED_IPS=${METRICS_ALLOWED_IPS}
      - LOCAL_DEVELOPMENT_IPS=${LOCAL_DEVELOPMENT_IPS}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN}

  workers:
    image: ghcr.io/genario-ru/backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run start:workers
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_FIXED_SIGN_IN_OTPS=${BETTER_AUTH_FIXED_SIGN_IN_OTPS}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - SOCIALKIT_OPENAPI_URL=${SOCIALKIT_OPENAPI_URL}
      - SOCIALKIT_BASE_API_URL=${SOCIALKIT_BASE_API_URL}
      - SOCIALKIT_API_KEY=${SOCIALKIT_API_KEY}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED=${SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED}
      - UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED=${UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED}
      - TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED=${TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN}
